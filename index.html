<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>à la recherche du musée virtuel</title>
  <style>
    /* Reset et style de base brut/minimaliste */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      font-family: monospace; /* Style net art classique */
      overflow: hidden; /* Évite les barres de défilement globales */
    }

    /* Conteneur principal en Flexbox vertical */
    body {
      display: flex;
      flex-direction: column;
    }

    /* Texte de présentation épuré en haut */
    .intro {
      padding: 10px 20px;
      font-size: 0.9rem;
      border-bottom: 1px solid #000000; /* Ligne de séparation brute */
      text-transform: lowercase;
    }

    /* Conteneur central pour le contenu */
    .main-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center; /* Centre verticalement */
      align-items: center;     /* Centre horizontalement */
      text-align: center;
      padding: 20px;
    }

    /* Style du titre net art */
    h1 {
      font-size: 1.2rem;
      font-weight: normal;
      margin-bottom: 30px;
      text-transform: lowercase; /* Optionnel : pour le style minimaliste */
    }

    /* Style du lien/image cliquable */
    .download-link {
      display: inline-block;
      text-decoration: none;
      color: #000000;
      transition: opacity 0.2s ease;
    }

    /* Effet au survol de l'image (conceptuel) */
    .download-link:hover {
      opacity: 0.6;
    }

    .download-image {
      max-width: 100%;
      height: auto;
      max-height: 300px; /* Limite la taille de l'image pour rester élégant */
      border: 1px solid #000000; /* Bordure brute style net art autour de l'image */
      padding: 5px;
    }

    /* Petit texte d'indice sous l'image */
    .caption {
      margin-top: 15px;
      font-size: 0.8rem;
      color: #666666;
    }
  </style>
</head>
<body>

  <div class="intro">
    elo teaser d'expérimentation 1
  </div>

  <div class="main-content">
    <h1>à la recherche du musée virtuel</h1>

    <a href="recherche_elovuaro2_compressed-2-1.pdf" download="musee-virtuel.pdf" class="download-link">
      <img src="ton-image.jpg" alt="Cliquez pour télécharger le PDF" class="download-image">
      <div class="caption">[cliquer pour télécharger le pdf]</div>
    </a>
  </div>

</body>
</html>
